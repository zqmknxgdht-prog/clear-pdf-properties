name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-arm64
          - os: macos-13
            label: macos-x64
          - os: ubuntu-latest
            label: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: pyinstaller build/app.spec
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          Compress-Archive -Path dist/clear-pdf-properties.exe, dist/clear-pdf-properties-cli.exe `
            -DestinationPath "clear-pdf-properties-$v-${{ matrix.label }}.zip"
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          v="${{ github.ref_name }}"
          tar -C dist -czf "clear-pdf-properties-$v-${{ matrix.label }}.tar.gz" clear-pdf-properties
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: clear-pdf-properties-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
